[tool.poetry]
name = "digitization"
version = "0.1.0"
description = ""
authors = ["Harris Tzovanakis <me@drjova.com>"]

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
pysftp = "^0.2.9"
click = "^8.0.3"
boto3 = "^1.38.9"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
tqdm = "^4.67.1"
pypdf = "^6.9.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
digitization = "digitization.cli:digitization"
digitization_v2 = "refactory.cli:digitization_v2"

[dependency-groups]
dev = [
    "apache-airflow (>=3.2.2,<4.0.0)",
    "apache-airflow-providers-standard (>=1.13.1,<2.0.0)",
    "apache-airflow-providers-amazon (>=9.29.0,<10.0.0)"
]
